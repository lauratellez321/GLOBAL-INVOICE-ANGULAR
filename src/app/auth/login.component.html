<section class="login-card">
  <header class="login-brand">
    <img src="assets/davivienda-logo.webp" alt="Logo Global Invoice" />
    <div>
      <span>PLATAFORMA DE FACTURACIÓN</span>
      <h1>Global Invoice</h1>
    </div>
  </header>
  <p class="login-intro"></p>
  <label for="email">Correo</label
  ><input id="email" [(ngModel)]="email" type="email" />
  <label for="password">Contraseña</label
  ><input id="password" [(ngModel)]="password" type="password" />
  <p class="error" *ngIf="error">{{ error }}</p>
  <button (click)="submit()">Ingresar</button>
</section>
