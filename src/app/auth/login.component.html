<section class="login-card">
  <h1>Global Invoice</h1><p>Ingrese con su cuenta asignada.</p>
  <label for="email">Correo</label><input id="email" [(ngModel)]="email" type="email">
  <label for="password">Contraseña</label><input id="password" [(ngModel)]="password" type="password">
  <p class="error" *ngIf="error">{{ error }}</p><button (click)="submit()">Ingresar</button>
</section>
